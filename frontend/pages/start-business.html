<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start a New Business — Samarth AI</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Minimal page-specific styles to keep the visual identity and responsiveness */
    body { background-color: #FBF6EE; }
    .page-header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem; }
    .brand { display:flex; align-items:center; gap:.6rem; font-weight:700; font-size:1.15rem; color:#113B2B; }
    .back-link { color:#113B2B; text-decoration:none; font-size:0.95rem; }
    .start-inner { max-width:880px; margin:1.5rem auto; padding:1rem; }
    .form-card { background:#fff; border-radius:12px; padding:1.25rem; box-shadow:0 6px 18px rgba(16,24,32,0.08); }
    .subtitle { color:#374151; margin-top:0.25rem; margin-bottom:1rem; }
    .form-row { display:flex; flex-direction:column; gap:.35rem; margin-bottom:.9rem; }
    label { font-weight:600; color:#0f3b2a; }
    input[type="text"], select { padding:.6rem .75rem; border:1px solid #e6e6e6; border-radius:8px; font-size:1rem; }
    .actions { display:flex; justify-content:flex-end; margin-top:1rem; }
    .primary-btn { background:#0f3b2a; color:#fff; padding:.6rem 1rem; border-radius:8px; border:none; font-weight:700; cursor:pointer; }
    .primary-btn:disabled { opacity:0.6; cursor:not-allowed; }
    @media (min-width:720px) {
      .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
      .form-row.full { grid-column:1/-1; }
    }
  </style>
</head>
<body>
  <header class="page-header wrap">
    <a class="back-link" href="../samarthAI.html">← Back to Samarth</a>
    <div class="brand">Samarth AI</div>
  </header>

  <main class="start-inner wrap">
    <h1>Start a New Business</h1>
    <p class="subtitle">Tell us about your idea and we'll help you understand the first steps.</p>

    <div class="form-card" role="region" aria-labelledby="start-heading">
      <form id="startForm" novalidate>
        <div class="form-grid">
          <div class="form-row full">
            <label for="idea">Business idea / What do you want to start?</label>
            <input id="idea" name="idea" type="text" required placeholder="e.g., small grocery shop, milk collection centre">
          </div>

          <div class="form-row">
            <label for="location">Location</label>
            <input id="location" name="location" type="text" required placeholder="Town / village, district">
          </div>

          <div class="form-row">
            <label for="type">Business type</label>
            <select id="type" name="type" required>
              <option value="">Select a type</option>
              <option>Shop</option>
              <option>Food business</option>
              <option>Farming / Agriculture</option>
              <option>Service business</option>
              <option>Manufacturing</option>
              <option>Other</option>
            </select>
          </div>

          <div class="form-row">
            <label for="investment">Approximate investment</label>
            <select id="investment" name="investment" required>
              <option value="">Select an amount</option>
              <option>Below ₹50,000</option>
              <option>₹50,000 – ₹1 lakh</option>
              <option>₹1 lakh – ₹5 lakh</option>
              <option>₹5 lakh – ₹10 lakh</option>
              <option>Above ₹10 lakh</option>
            </select>
          </div>

          <div class="form-row full">
            <label for="existing">Do you already have a business?</label>
            <select id="existing" name="existing" required>
              <option value="">Select</option>
              <option>No, I'm starting from scratch</option>
              <option>Yes, I already have a small business</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary-btn">Continue →</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // Basic client-side validation: use HTML5 constraint API and prevent proceeding if invalid.
    (function(){
      var form = document.getElementById('startForm');

      form.addEventListener('submit', function(e){

        e.preventDefault();

        if (!form.checkValidity()){
          form.reportValidity();
          return;
        }

        // Collect the user's business information
        const businessContext = {
          intent: "start_business",
          businessIdea: document.getElementById("idea").value.trim(),
          location: document.getElementById("location").value.trim(),
          businessType: document.getElementById("type").value,
          investment: document.getElementById("investment").value,
          existingBusiness: document.getElementById("existing").value
        };

        // Temporarily store the context so the chat page can use it
        sessionStorage.setItem(
          "samarthBusinessContext",
          JSON.stringify(businessContext)
        );

        console.log(
            "Business context saved:",
            businessContext
        );

        // Open the Samarth business conversation
        window.location.href = "business-chat.html";
      });
    })();
  </script>
</body>
</html>
